<html lang="es">

<style>
:root{
  /* Layout: una columna angosta tipo planilla de gimnasio, navegación fija abajo */
  --bg:#eceef1; --surface:#ffffff; --ink:#15181d; --muted:#5a616c; --line:#d6dae0;
  --accent:#d4461a; --accent-ink:#ffffff; --accent-soft:#fbe5db;
  --good:#1d7548; --good-soft:#dcf1e5; --warn:#9a5b00; --warn-soft:#fbecd2;
  --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101215; --surface:#1a1d22; --ink:#e8ebef; --muted:#9aa1ac; --line:#2c3139;
    --accent:#ff7442; --accent-ink:#1a0d07; --accent-soft:#3b2218;
    --good:#62c792; --good-soft:#173527; --warn:#f0b257; --warn-soft:#3a2b12;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101215; --surface:#1a1d22; --ink:#e8ebef; --muted:#9aa1ac; --line:#2c3139;
  --accent:#ff7442; --accent-ink:#1a0d07; --accent-soft:#3b2218;
  --good:#62c792; --good-soft:#173527; --warn:#f0b257; --warn-soft:#3a2b12;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 150px calc(16px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;margin:0}
.brand span{color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.hero{border-left:5px solid var(--accent)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
h2{font-family:var(--font-display);font-weight:700;font-size:40px;line-height:1;margin:0;text-transform:uppercase;text-wrap:balance}
h3{font-family:var(--font-display);font-weight:600;font-size:21px;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.chips{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 12px;font-family:var(--font-display);font-weight:700;font-size:18px;min-width:44px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:12px}
.opt b{display:block;font-weight:600}
.opt span{font-size:13px;color:var(--muted)}
.opt .radio{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .radio{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%)}
.btn{border:none;border-radius:10px;padding:13px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);font-size:16px;width:100%}
.btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{width:auto;padding:8px 12px;font-size:14px}
.btn.danger{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:none}
.num{font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--font-display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.banner{border-radius:10px;padding:12px;background:var(--warn-soft);color:var(--ink);display:flex;flex-direction:column;gap:8px;font-size:14px}
/* Sesión */
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sets{display:grid;grid-template-columns:auto 1fr 1fr 48px;gap:6px 8px;align-items:center}
.sets .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sets input{width:100%;min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:17px;font-variant-numeric:tabular-nums;text-align:center}
.setn{font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--muted);width:28px}
.check{width:48px;height:44px;border-radius:8px;border:1.5px solid var(--line);background:transparent;font-size:20px;line-height:1}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.done-row input{border-color:transparent;background:var(--good-soft)}
.timer{position:fixed;left:0;right:0;bottom:64px;display:flex;justify-content:center;padding:0 12px;pointer-events:none;z-index:5}
.timer[hidden]{display:none}
.timer-in{pointer-events:auto;max-width:536px;width:100%;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.timer-in .t{font-family:var(--font-display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;min-width:84px}
.timer-in .lbl{flex:1;font-size:13px;opacity:.85}
.timer-in button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:6px 9px;font-size:13px}
.timer-in.end{background:var(--accent);color:var(--accent-ink)}
.bar{height:4px;border-radius:2px;background:rgba(127,127,127,.35);overflow:hidden}
.bar i{display:block;height:100%;background:currentColor}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);max-width:560px;width:100%}
nav.tabs button{background:none;border:none;padding:10px 4px 12px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;border-top:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent);font-weight:600}
nav.tabs svg{width:22px;height:22px}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-size:14px;color:var(--muted)}
select,textarea,.inp{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:90px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.wt-grid{display:grid;grid-template-columns:1fr 96px;gap:6px 10px;align-items:center}
.wt-grid input{text-align:center;font-variant-numeric:tabular-nums}
.chart-wrap{position:relative}
.chart-wrap svg{width:100%;height:auto;display:block;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
.res{font-size:13px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap}
.res.up{background:var(--good-soft);color:var(--good)}
.res.hold{background:var(--bg);color:var(--muted)}
.res.down{background:var(--warn-soft);color:var(--warn)}
.res.new{background:var(--accent-soft);color:var(--accent)}
.res.pr{background:var(--accent-soft);color:var(--accent);font-size:12px}
.prcard{border-left:5px solid var(--good)}
.notebox{background:var(--warn-soft);border-radius:8px;padding:8px 10px;white-space:pre-wrap}
.notein{min-height:64px;font-family:var(--font-body);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 4px;border-top:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:500;border-top:none}
td.r,th.r{text-align:right}
ol.mob{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sheet{position:fixed;inset:0;background:rgba(10,12,15,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:12px}
.sheet[hidden]{display:none}
.sheet-in{background:var(--surface);color:var(--ink);border-radius:14px;max-width:536px;width:100%;max-height:92%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.figbox{background:var(--bg);border-radius:10px;padding:8px}
.figbox svg{width:100%;height:auto;display:block;max-height:46vh}
.limb{fill:none;stroke:var(--ink);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.limb.far{stroke:var(--muted);opacity:.7}
.headc{fill:var(--ink)}
.fl{stroke:var(--line);stroke-width:3}
.eq{fill:var(--muted);stroke:var(--muted);opacity:.55}
.eqs{stroke:var(--muted);stroke-width:3;opacity:.55}
.eqc{fill:var(--surface);stroke:var(--muted);stroke-width:2}
.cab{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:3 2}
.plate{fill:none;stroke:var(--accent);stroke-width:5}
.hub{fill:var(--accent)}
.dbh{stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.dbw{fill:var(--accent)}
.sled{stroke:var(--accent);stroke-width:5;stroke-linecap:round}
.howbtn{background:none;border:none;padding:0;color:var(--accent);font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.exlink{background:none;border:none;padding:0;text-align:left;color:inherit;text-decoration:underline dotted var(--muted);text-underline-offset:3px}
.vlist{display:flex;flex-direction:column;gap:6px}
.vrow{display:grid;grid-template-columns:86px 1fr 34px;gap:8px;align-items:center;font-size:13px}
.vrow .num{text-align:right}
.vbar{position:relative;height:10px;border-radius:5px;background:var(--bg);overflow:hidden}
.vbar i{position:absolute;top:0;bottom:0;left:0;display:block}
.vbar .band{background:var(--good-soft);border-left:1px solid var(--good);border-right:1px solid var(--good)}
.vbar .fill{background:var(--muted);border-radius:0 5px 5px 0}
.vbar .fill.good{background:var(--good)}
.vbar .fill.warn{background:var(--warn)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
"use strict";
/* ===================== Programa ===================== */
const EX = {
  sentadilla:{n:'Sentadilla con barra',min:6,max:10,inc:2.5,rest:150},
  press_banca:{n:'Press de banca',min:8,max:12,inc:2.5,rest:120},
  remo_barra:{n:'Remo con barra',min:8,max:12,inc:2.5,rest:120},
  face_pull:{n:'Face pull en polea',min:12,max:15,inc:2.5,rest:75},
  crunch:{n:'Crunch en polea',min:10,max:15,inc:2.5,rest:60},
  pmr:{n:'Peso muerto rumano',min:6,max:10,inc:2.5,rest:150},
  press_militar:{n:'Press militar',min:6,max:10,inc:2.5,rest:150},
  jalon:{n:'Jalón al pecho',min:8,max:12,inc:2.5,rest:105},
  zancadas:{n:'Zancadas con mancuernas',min:8,max:12,inc:2,rest:90,note:'Peso por mancuerna · reps por pierna'},
  triceps:{n:'Tríceps en polea',min:10,max:15,inc:2.5,rest:60},
  prensa:{n:'Prensa de piernas',min:10,max:15,inc:5,rest:120},
  press_inc:{n:'Press inclinado con mancuernas',min:8,max:12,inc:2,rest:120,note:'Peso por mancuerna'},
  remo_manc:{n:'Remo a una mano con mancuerna',min:8,max:12,inc:2,rest:90,note:'Reps por lado'},
  hip_thrust:{n:'Hip thrust',min:8,max:12,inc:5,rest:120},

  remo_maq:{n:'Remo en máquina con apoyo de pecho',min:8,max:12,inc:2.5,rest:120},

  ext_cuad:{n:'Extensión de cuádriceps',min:12,max:15,inc:2.5,rest:75},
  gemelos:{n:'Gemelos en prensa',min:12,max:20,inc:5,rest:60},
  pallof:{n:'Pallof press',min:10,max:12,inc:2.5,rest:60,note:'Reps por lado · core sin flexionar la columna'},
  /* Alternativas (para cuando la máquina está ocupada) */
  press_maq:{n:'Press de pecho en máquina',min:8,max:12,inc:2.5,rest:120},
  press_inc_maq:{n:'Press inclinado en máquina',min:8,max:12,inc:2.5,rest:120},
  remo_polea:{n:'Remo sentado en polea',min:8,max:12,inc:2.5,rest:105,note:'Torso erguido y quieto, sin balancear'},
  press_hombro_maq:{n:'Press de hombros en máquina',min:8,max:12,inc:2.5,rest:120},
  pajaros_maq:{n:'Aperturas invertidas en máquina',min:12,max:15,inc:2.5,rest:75},
  triceps_cabeza:{n:'Extensión de tríceps sobre la cabeza en polea',min:10,max:15,inc:2.5,rest:60},
  prensa_hor:{n:'Prensa horizontal sentado',min:10,max:15,inc:5,rest:120},
  bulgara:{n:'Sentadilla búlgara con mancuernas',min:8,max:12,inc:2,rest:90,note:'Peso por mancuerna · reps por pierna'},
  curl_fem_sent:{n:'Curl femoral sentado',min:10,max:15,inc:2.5,rest:90},
  gemelos_sent:{n:'Gemelos sentado en máquina',min:12,max:20,inc:2.5,rest:60},
  jalon_neutro:{n:'Jalón con agarre neutro',min:8,max:12,inc:2.5,rest:105},
  laterales_polea:{n:'Elevación lateral en polea',min:12,max:20,inc:1.25,rest:60,note:'Reps por lado'},
  curl_polea:{n:'Curl de bíceps en polea',min:10,max:15,inc:2.5,rest:60},
  curl_martillo:{n:'Curl martillo con mancuernas',min:10,max:15,inc:1,rest:60,note:'Peso por mancuerna'},
  hip_thrust_maq:{n:'Hip thrust en máquina',min:8,max:12,inc:5,rest:120}
};
/* Alternativas que cuidan la zona lumbar igual que el original */
const ALT = {
  press_banca:['press_maq','press_inc'],
  press_inc:['press_inc_maq','press_banca'],
  remo_maq:['remo_polea','remo_manc'],
  remo_manc:['remo_maq','remo_polea'],
  press_hombro:['press_hombro_maq'],
  face_pull:['pajaros_maq'],
  triceps:['triceps_cabeza'],
  prensa:['prensa_hor','bulgara'],
  curl_fem:['curl_fem_sent'],
  ext_cuad:['bulgara'],
  gemelos:['gemelos_sent'],
  jalon:['jalon_neutro'],
  laterales:['laterales_polea'],
  curl:['curl_polea','curl_martillo'],
  zancadas:['bulgara','prensa'],
  hip_thrust:['hip_thrust_maq']
};
function altsFor(k){
  if(ALT[k]) return ALT[k].slice();
  const base=Object.keys(ALT).find(o=>ALT[o].includes(k));
  return base?[base,...ALT[base]].filter(x=>x!==k):[];
}
const PLAN = {
  A:{focus:'Torso · empuje y tirón',ex:['press_banca','remo_maq','press_hombro','face_pull','triceps']},
  B:{focus:'Piernas · prensa y femorales',ex:['prensa','curl_fem','ext_cuad','gemelos','pallof']},
  C:{focus:'Torso · inclinado y dorsales',ex:['press_inc','jalon','remo_manc','laterales','curl']},
  D:{focus:'Piernas · unilateral y glúteos',ex:['zancadas','hip_thrust','curl_fem','ext_cuad','pallof']}
};
const ORDER = ['A','B','C','D'];
/* Ejercicios del plan aplicando los cambios permanentes ("desde ahora") */
function planEx(p){const sw=(S&&S.swaps)||{};return PLAN[p].ex.map(k=>sw[k]&&EX[sw[k]]?sw[k]:k)}
function activeKeys(){const set=new Set();ORDER.forEach(p=>planEx(p).forEach(k=>set.add(k)));sessions.forEach(s=>(s.items||[]).forEach(it=>{if(EX[it.k])set.add(it.k)}));return [...set]}
const REENTRY = 8;          // sesiones de reingreso
const DELOAD_EVERY = 20;   // ~5 semanas a 4/sem
const DELOAD_LEN = 4;      // una semana liviana = 4 sesiones
const BACKUP_DAYS = 14;    // recordatorio de respaldo
const MUSC={press_maq:{Pecho:1,'Tríceps':.5,Hombros:.5},press_inc_maq:{Pecho:1,Hombros:.5,'Tríceps':.5},remo_polea:{Espalda:1,'Bíceps':.5},press_hombro_maq:{Hombros:1,'Tríceps':.5},pajaros_maq:{Hombros:1,Espalda:.5},triceps_cabeza:{'Tríceps':1},prensa_hor:{'Cuádriceps':1,'Glúteos':.5},bulgara:{'Cuádriceps':1,'Glúteos':1},curl_fem_sent:{Isquios:1},gemelos_sent:{Gemelos:1},jalon_neutro:{Espalda:1,'Bíceps':.5},laterales_polea:{Hombros:1},curl_polea:{'Bíceps':1},curl_martillo:{'Bíceps':1},hip_thrust_maq:{'Glúteos':1,Isquios:.5},press_banca:{Pecho:1,'Tríceps':.5,Hombros:.5},remo_maq:{Espalda:1,'Bíceps':.5},press_hombro:{Hombros:1,'Tríceps':.5},face_pull:{Hombros:1,Espalda:.5},triceps:{'Tríceps':1},prensa:{'Cuádriceps':1,'Glúteos':.5},curl_fem:{Isquios:1},ext_cuad:{'Cuádriceps':1},gemelos:{Gemelos:1},pallof:{Core:1},press_inc:{Pecho:1,Hombros:.5,'Tríceps':.5},jalon:{Espalda:1,'Bíceps':.5},remo_manc:{Espalda:1,'Bíceps':.5},laterales:{Hombros:1},curl:{'Bíceps':1},zancadas:{'Cuádriceps':1,'Glúteos':1},hip_thrust:{'Glúteos':1,Isquios:.5}};
const GROUPS=['Pecho','Espalda','Hombros','Bíceps','Tríceps','Cuádriceps','Isquios','Glúteos','Gemelos','Core'];
const MOBILITY = [
  'Caminata o bici suave — 8 a 10 min',
  'Gato-camello — 10 repeticiones',
  'Rotaciones torácicas en cuadrupedia — 8 por lado',
  'Estiramiento de flexores de cadera — 45 s por lado',
  'Sentadilla profunda sostenida, agarrado de algo — 3 × 30 s',
  'Respiración diafragmática acostado — 2 min'
];
const RD = {
  ok:{t:'Descansado',d:'Sesión completa. Cuenta para progresar.'},
  poco:{t:'Dormí poco',d:'Una serie menos y −10 % de peso. No cuenta para progresar.'},
  guardia:{t:'Salgo de guardia',d:'2 series a −20 % y reps al mínimo, o solo movilidad.'}

/* ===================== Estado ===================== */
function freshState(){return {v:2,nextIdx:0,done:0,phaseStart:0,sinceDeload:0,deload:0,ex:{},swaps:{},notes:{},created:Date.now(),lastBackup:0,backupSnooze:0}}
let S = freshState();

function clone(o){return JSON.parse(JSON.stringify(o))}
function normalize(s){const f=freshState();if(s&&!s.created)f.created=0;return Object.assign(f,s||{},{ex:Object.assign({},(s&&s.ex)||{}),swaps:Object.assign({},(s&&s.swaps)||{}),notes:Object.assign({},(s&&s.notes)||{})})}
function lsLoad(){

/* ===================== Guardado en la cuenta (db) ===================== */
const cloud = {db:null,uid:null,state:'local'};
let writeChain = Promise.resolve();
function queue(fn){writeChain = writeChain.then(fn).catch(err=>{console.warn(err);cloud.state='error';renderTop()});return writeChain}
function profRef(){return cloud.db.doc('data/users/'+cloud.uid+'/profile')}
function sessCol(){return profRef().collection('sessions')}
const sleep = ms=>new Promise(r=>setTimeout(r,ms));
function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),ms))])}
function stripId(s){const c=clone(s);delete c.id;return c}

async function initCloud(){
  for(let i=0;i<40&&!(window.claude&&window.claude.use);i++) await sleep(100);
  if(!(window.claude&&window.claude.use)){cloud.state='local';return renderTop()}
  try{
    const [db,user] = await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const uid = user ? await user.id() : null;
    if(!db||!uid){cloud.state='local';return renderTop()}
    cloud.db=db;cloud.uid=uid;
    const [p,q] = await withTimeout(Promise.all([profRef().get(),sessCol().orderBy('ts','desc').limit(800).get()]),10000);
    if(p.exists){
      S = normalize(clone(p.data()).S);
      {const bd=clone(p.data()).body;if(Array.isArray(bd))body=bd}
      sessions = q.docs.map(d=>Object.assign(clone(d.data()),{id:d.id}));
      lsSave();
    }else if(sessions.length||S.done){
      const local = sessions.slice();
      queue(async()=>{await profRef().set({S:clone(S)});for(const s of local){await sessCol().doc(s.id).set(stripId(s))}});
    }
    cloud.state='cloud';
  }catch(e){cloud.db=null;cloud.state=(e&&e.code==='timeout')?'offline':'local'}
  render();
}
function persist(newSession){
  lsSave();
  if(!cloud.db) return;
  const snapS = clone(S);
  queue(async()=>{
    if(newSession) await sessCol().doc(newSession.id).set(stripId(newSession));

  });

/* ===================== Utilidades ===================== */
const $ = s=>document.querySelector(s);
const app = $('#app');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n){return n==null||isNaN(n)?'—':Number(n).toLocaleString('es-AR',{maximumFractionDigits:2})}
function num(v){if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n}
function r05(x){return Math.round(x*2)/2}
function dLabel(ts,opt){return new Date(ts).toLocaleDateString('es-AR',opt||{weekday:'short',day:'numeric',month:'short'})}
function mmss(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function e1rm(w,r){return w*(1+r/30)}
function phase(){if(S.deload>0)return'descarga';return (S.done-(S.phaseStart||0))<REENTRY?'reingreso':'progresion'}
function phaseText(){
  const p=phase();
  if(p==='descarga') return {pill:'Descarga',cls:'warn',t:`Semana de descarga · ${S.deload===1?'queda 1 sesión':'quedan '+S.deload+' sesiones'} · 2 series al 85 %`};
  if(p==='reingreso'){const n=S.done-(S.phaseStart||0)+1;return {pill:'Reingreso',cls:'acc',t:`Reingreso · sesión ${n} de ${REENTRY} · 2 series dejando 3–4 reps en reserva`}}
  return {pill:'Hipertrofia',cls:'good',t:'Hipertrofia · 4 series en los 2 primeros ejercicios y 3 en el resto, dejando 1–2 reps en reserva'};
}
function trainingSessions(){return sessions.filter(s=>s.plan!=='MOV')}

/* Prescripción del día para un ejercicio */
function presc(k,rd,main){
  const e=EX[k], st=S.ex[k]||{}, p=phase();
  let sets=p==='reingreso'?2:(main?4:3), f=1, prog=true, rir=p==='reingreso'?'3–4':'1–2';
  if(p==='descarga'){sets=2;f=.85;prog=false;rir='3–4'}
  if(rd==='poco'){sets=Math.max(2,sets-1);f*=.9;prog=false;rir='3'}
  if(rd==='guardia'){sets=2;f*=.8;prog=false;rir='4'}
  const w = st.w!=null ? (f===1?st.w:r05(st.w*f)) : null;
  let target;
  if(!prog) target=e.min;
  else if(st.last&&st.last.length) target=Math.min(e.max,Math.max(e.min,Math.min(...st.last)+1));
  else target=e.min;
  return {sets,w,target,rir,prog,rest:e.rest+(rd==='guardia'?30:0)};
}

/* ===================== Temporizador ===================== */
let tmr = null, tick = null, actx = null;
function audio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){
  try{if(!actx)return;const t0=actx.currentTime;[0,.25,.5].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.0001,t0+d);g.gain.exponentialRampToValueAtTime(.3,t0+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d+.18);o.connect(g).connect(actx.destination);o.start(t0+d);o.stop(t0+d+.2)})}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
}
/* Aviso del sistema cuando termina el descanso con la app en segundo plano o la pantalla bloqueada.
   Lo programa el service worker; si la app está a la vista, suena el pitido normal. */
function swPost(msg){try{const c=navigator.serviceWorker&&navigator.serviceWorker.controller;if(c)c.postMessage(msg)}catch(e){}}
function syncTimerSW(){if(tmr)swPost({type:'timer',end:tmr.end,label:tmr.label});else swPost({type:'timer-cancel'})}
function askNotif(){try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission().then(()=>{render()})}catch(e){}}
function notifState(){if(!('Notification' in window)||!('serviceWorker' in navigator))return 'no';return Notification.permission}
function startTimer(sec,label){tmr={end:Date.now()+sec*1000,total:sec,label,rang:false};clearInterval(tick);tick=setInterval(drawTimer,250);drawTimer();syncTimerSW()}
function stopTimer(){tmr=null;clearInterval(tick);$('#timer').hidden=true;syncTimerSW()}
function drawTimer(){
  const el=$('#timer');if(!tmr){el.hidden=true;return}
  const left=(tmr.end-Date.now())/1000, end=left<=0;
  if(end&&!tmr.rang){tmr.rang=true;beep()}
  if(left<-60){tmr=null;clearInterval(tick);el.hidden=true;return}
  el.hidden=false;
  const pct=end?100:Math.min(100,100*(1-left/tmr.total));
  el.innerHTML=`<div class="timer-in${end?' end':''}" role="timer" aria-live="off">
    <div class="t">${end?'¡Ya!':mmss(left)}</div>
    <div class="lbl">${end?'A la próxima serie':'Descanso · '+esc(tmr.label)}<div class="bar"><i style="width:${pct}%"></i></div></div>
    ${end?'':'<button data-act="t-minus">−15</button><button data-act="t-plus">+15</button>'}
    <button data-act="t-skip">${end?'Cerrar':'Saltar'}</button></div>`;
}

/* ===================== Sesión ===================== */
function startSession(){
  audio();askNotif();
  const plan=todayPlan||ORDER[S.nextIdx%ORDER.length];
  const items=planEx(plan).map((k,ix)=>makeItem(k,ix<2,todayRd));
  const pr=presc(planEx(plan)[0],todayRd);
  draft={id:'s'+Date.now(),ts:Date.now(),plan,rd:todayRd,prog:pr.prog,phase:phase(),items};
  confirmCancel=false;finishWarn=null;
  draftSave();view='hoy';render();window.scrollTo(0,0);
}
function makeItem(k,main,rd){const p=presc(k,rd,main);return {k,main,n:p.sets,target:p.target,rir:p.rir,rest:p.rest,sets:Array.from({length:p.sets},()=>({w:p.w,r:p.target,done:false}))}}

/* Aplica el resultado de un ejercicio sobre su estado previo. Devuelve el estado nuevo y el mensaje. */
function applyItem(k,sets,n,prog,rd,before){
  const e=EX[k], st=Object.assign({w:null,fails:0,last:null},before||{});
  const w=sets[0].w;let res;
  if(st.w==null){
    st.w=prog?w:r05(w/({poco:.9,guardia:.8}[rd]||1));
    st.last=prog?sets.map(s=>s.r):null;
    res={c:'new',t:`Peso base: ${fmt(st.w)} kg`};
  }else if(!prog){
    res={c:'hold',t:`Sin cambios · sigue en ${fmt(st.w)} kg`};
  }else{
    const allTop=sets.length>=n&&sets.every(s=>s.r>=e.max&&s.w>=w);
    if(allTop){st.w=w+e.inc;st.fails=0;st.last=null;res={c:'up',t:`Sube a ${fmt(st.w)} kg`}}
    else if(sets.some(s=>s.r<e.min)){
      st.fails=(st.fails||0)+1;
      if(st.fails>=2){st.w=r05(w*.9);st.fails=0;st.last=null;res={c:'down',t:`Baja a ${fmt(st.w)} kg`}}
      else{st.w=w;st.last=sets.map(s=>s.r);res={c:'hold',t:`Repetí ${fmt(w)} kg · no llegaste al mínimo`}}
    }else{st.w=w;st.fails=0;st.last=sets.map(s=>s.r);res={c:'hold',t:`Mantener ${fmt(w)} kg · buscá +1 rep`}}
  }
  return {st,res};
}
/* Mejor 1RM estimado de un ejercicio en el historial (sin contar una sesión) */
function bestE1rm(k,skipId){let b=0;for(const s of sessions){if(s.id===skipId)continue;const it=(s.items||[]).find(x=>x.k===k);if(it)for(const x of it.sets||[])if(x.w!=null&&x.r>0)b=Math.max(b,e1rm(x.w,x.r))}return b}
function itemBest(sets){return sets.reduce((a,b)=>e1rm(b.w,b.r)>e1rm(a.w,a.r)?b:a)}
function calcPRs(sess){
  const prs={};
  for(const it of sess.items){const prev=bestE1rm(it.k,sess.id);if(!prev)continue;const b=itemBest(it.sets),v=e1rm(b.w,b.r);if(v>prev+0.01)prs[it.k]={w:b.w,r:b.r,e:Math.round(v*2)/2,prev:Math.round(prev*2)/2}}
  return prs;
}
function validSets(it){return it.sets.filter(s=>s.done&&s.r>0&&s.w!=null)}
function finishSession(force){
  const invalid=draft.items.reduce((a,it)=>a+it.sets.filter(s=>s.done&&!(s.r>0&&s.w!=null)).length,0);
  const anyValid=draft.items.some(it=>validSets(it).length);
  if(!anyValid){finishWarn={t:'none'};render();scrollToFinish();return}
  if(invalid&&!force){finishWarn={t:'invalid',n:invalid};render();scrollToFinish();return}
  finishWarn=null;
  const res={};let vol=0,nsets=0;
  const items=[];
  for(const it of draft.items){
    const done=validSets(it);
    if(!done.length) continue;
    done.forEach(s=>{vol+=s.w*s.r;nsets++});
    const before=S.ex[it.k]?clone(S.ex[it.k]):null;
    const sets=done.map(s=>({w:s.w,r:s.r}));
    const out=applyItem(it.k,sets,it.n,draft.prog,draft.rd,before);
    items.push({k:it.k,n:it.n,sets,before});
    res[it.k]=out.res;S.ex[it.k]=out.st;
  }
  const sess={id:draft.id,ts:draft.ts,plan:draft.plan,rd:draft.rd,prog:draft.prog,phase:draft.phase,items,res,vol:Math.round(vol),nsets,
    ctr:{nextIdx:S.nextIdx,deload:S.deload,sinceDeload:S.sinceDeload}};
  sess.prs=calcPRs(sess);
  S.nextIdx=(Math.max(0,ORDER.indexOf(draft.plan))+1)%ORDER.length;
  S.done++;
  if(S.deload>0){S.deload--;if(S.deload===0)S.sinceDeload=0}else S.sinceDeload++;
  sessions.unshift(sess);
  summary=sess;draft=null;todayPlan=null;todayRd='ok';
  draftSave();stopTimer();persist(sess);view='resumen';render();window.scrollTo(0,0);
}
function logMobility(){
  const sess={id:'s'+Date.now(),ts:Date.now(),plan:'MOV',rd:todayRd,prog:false,items:[],res:{},vol:0,nsets:0};
  sessions.unshift(sess);persist(sess);todayRd='ok';view='historial';render();
}

/* ===================== Editar / borrar sesiones ===================== */
/* ¿Es esta la sesión más reciente que incluye el ejercicio k? Solo ahí se recalcula el peso. */
function isLatestFor(id,k){for(const s of sessions){if((s.items||[]).some(x=>x.k===k))return s.id===id}return false}
function canRecalc(id,it){return Object.prototype.hasOwnProperty.call(it,'before')&&isLatestFor(id,it.k)}
function restoreEx(k,before){if(before)S.ex[k]=clone(before);else delete S.ex[k]}
function cloudDel(id){if(cloud.db)queue(async()=>{await sessCol().doc(String(id)).delete()})}
function deleteSession(id){
  const ix=sessions.findIndex(s=>s.id===id);if(ix<0)return;
  const sess=sessions[ix];
  if(sess.plan!=='MOV'){
    for(const it of sess.items||[]) if(canRecalc(id,it)) restoreEx(it.k,it.before);
    const latest=trainingSessions()[0];
    if(latest&&latest.id===id&&sess.ctr){S.nextIdx=sess.ctr.nextIdx;S.deload=sess.ctr.deload;S.sinceDeload=sess.ctr.sinceDeload}
    else if(S.sinceDeload>0&&!S.deload)S.sinceDeload--;
    S.done=Math.max(0,S.done-1);
  }
  sessions.splice(ix,1);
  if(summary&&summary.id===id)summary=null;
  cloudDel(id);persist();
}
function saveEdit(id){
  const sess=sessions.find(s=>s.id===id);if(!sess)return;
  const items=[];let vol=0,nsets=0;
  sess.items.forEach((it,i)=>{
    const sets=[];
    it.sets.forEach((x,j)=>{const w=num(($('#ew-'+i+'-'+j)||{}).value),r=num(($('#er-'+i+'-'+j)||{}).value);if(w!=null&&r>0)sets.push({w,r:Math.round(r)})});
    const recalc=canRecalc(id,it);
    if(!sets.length){if(recalc)restoreEx(it.k,it.before);delete sess.res[it.k];return}
    sets.forEach(s=>{vol+=s.w*s.r;nsets++});
    const ni=Object.assign({},it,{sets});
    if(recalc){const out=applyItem(it.k,sets,it.n||sets.length,sess.prog,sess.rd,it.before);S.ex[it.k]=out.st;sess.res[it.k]=out.res}
    items.push(ni);
  });
  if(!items.length){deleteSession(id);return}
  sess.items=items;sess.vol=Math.round(vol);sess.nsets=nsets;
  sess.prs=calcPRs(sess);
  persist(sess);
}
function openEdit(id){
  const s=sessions.find(x=>x.id===id);if(!s)return;
  editId=id;confirmDel=null;

  const blocks=(s.items||[]).map((it,i)=>`<div style="display:flex;flex-direction:column;gap:6px">

      ${it.sets.map((x,j)=>`<span class="setn">${j+1}</span><input id="ew-${i}-${j}" inputmode="decimal" aria-label="Kilos serie ${j+1}" value="${x.w!=null?fmt(x.w):''}"><input id="er-${i}-${j}" inputmode="numeric" aria-label="Reps serie ${j+1}" value="${x.r!=null?esc(x.r):''}">`).join('')}
      </div></div>`).join('');
  const anyRecalc=(s.items||[]).some(it=>canRecalc(id,it));
  $('#sheet').innerHTML=`<div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="edT">
    <div class="row between"><h3 id="edT">${mov?'Movilidad':'Sesión '+esc(s.plan)} · ${esc(dLabel(s.ts))}</h3><button class="btn sec small" data-act="edclose" aria-label="Cerrar">✕</button></div>
    ${mov?'<p class="small muted">Sesión de movilidad, sin series para editar.</p>':`<p class="small muted">Corregí kilos o repeticiones. Para quitar una serie, borrá sus kilos. ${anyRecalc?'Como es tu última vez en estos ejercicios, el peso de la próxima sesión se recalcula.':'Es una sesión vieja: se corrige el historial y los gráficos, pero no los pesos actuales (esos los ajustás en Ajustes).'}</p>
    ${blocks}
    <button class="btn" data-act="edsave">Guardar cambios</button>`}

  </div>`;

function doSwap(i,k,perm){

/* ===================== Peso corporal ===================== */
function addBody(){
  const kg=num(($('#bw-kg')||{}).value),cin=num(($('#bw-cin')||{}).value),bra=num(($('#bw-bra')||{}).value);
  if(kg==null&&cin==null&&bra==null)return false;
  body.unshift({ts:Date.now(),kg,cin,bra});persistBody();return true;
}
function persistBody(){lsSave();if(cloud.db){const b=clone(body);queue(async()=>{await profRef().set({S:clone(S),body:b})})}}
function bodyChart(){
  const h=body.filter(b=>b.kg!=null).slice().reverse();
  if(h.length<2)return '';
  const W=520,H=150,pl=40,pr=18,pt=14,pb=24;
  let lo=Math.min(...h.map(p=>p.kg)),hi=Math.max(...h.map(p=>p.kg));
  const span=Math.max(hi-lo,2),step=[.5,1,2,5,10].find(s=>span/s<=4)||10;
  lo=Math.floor((lo-step*.3)/step)*step;hi=Math.ceil((hi+step*.3)/step)*step;
  const t0=h[0].ts,t1=h[h.length-1].ts||t0+1;
  const x=t=>pl+(W-pl-pr)*((t-t0)/Math.max(1,t1-t0)),y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let grid='';for(let v=lo;v<=hi+1e-9;v+=step)grid+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v)}</text>`;
  const line=h.map((p,i)=>`${i?'L':'M'}${x(p.ts).toFixed(1)},${y(p.kg).toFixed(1)}`).join('');
  const lp=h[h.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Peso corporal, último ${fmt(lp.kg)} kilos">${grid}

function exHistory(k){
  return trainingSessions().slice().reverse().map(s=>{const it=(s.items||[]).find(x=>x.k===k);if(!it||!it.sets||!it.sets.length)return null;
    const best=it.sets.reduce((a,b)=>e1rm(b.w,b.r)>e1rm(a.w,a.r)?b:a);
    return {ts:s.ts,w:Math.max(...it.sets.map(x=>x.w)),best,e:e1rm(best.w,best.r)}}).filter(Boolean);
}

function vVolume(){
  const since=Date.now()-7*864e5, v={};GROUPS.forEach(g=>v[g]=0);
  trainingSessions().filter(s=>s.ts>since).forEach(s=>(s.items||[]).forEach(it=>{const m=MUSC[it.k];if(!m)return;const n=(it.sets||[]).length;for(const g in m)v[g]+=n*m[g]}));
  const MAX=20,lo=8,hi=16;
  const rows=GROUPS.map(g=>{const x=v[g],st=x>=lo?(x>hi?'warn':'good'):'';
    return `<div class="vrow"><span>${g}</span><div class="vbar"><i class="band" style="left:${lo/MAX*100}%;width:${(hi-lo)/MAX*100}%"></i><i class="fill ${st}" style="width:${Math.min(100,x/MAX*100)}%"></i></div><span class="num">${fmt(Math.round(x*2)/2)}</span></div>`}).join('');

let chartPts=[], chartGeom=null;
function chartSVG(h){
  chartPts=h;
  if(!h.length) return '<p class="muted small" style="padding:24px 0">Todavía no hay registros de este ejercicio. Aparece después de la primera sesión que lo incluya.</p>';
  const W=520,H=210,pl=40,pr=18,pt=14,pb=26;
  let lo=Math.min(...h.map(p=>p.w)),hi=Math.max(...h.map(p=>p.w));
  const span=Math.max(hi-lo,4), steps=[1,2,2.5,5,10,20,25,50];
  const step=steps.find(s=>span/s<=4)||50;
  lo=Math.floor((lo-step*.3)/step)*step;if(lo<0)lo=0;hi=Math.ceil((hi+step*.3)/step)*step;if(hi===lo)hi=lo+step;
  const x=i=>h.length===1?(pl+(W-pl-pr)/2):pl+i*(W-pl-pr)/(h.length-1);
  const y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  chartGeom={W,H,x,y,pt,pb};
  let grid='';for(let v=lo;v<=hi+1e-9;v+=step){grid+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v)}</text>`}
  const line=h.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.w).toFixed(1)}`).join('');
  const area=h.length>1?`<path d="${line}L${x(h.length-1)},${H-pb}L${x(0)},${H-pb}Z" fill="var(--accent)" opacity=".12"/>`:'';
  const lastI=h.length-1, lp=h[lastI];
  const xl=`<text x="${x(0)}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="${h.length===1?'middle':'start'}">${esc(dLabel(h[0].ts,{day:'numeric',month:'short'}))}</text>`+(h.length>1?`<text x="${x(lastI)}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="end">${esc(dLabel(lp.ts,{day:'numeric',month:'short'}))}</text>`:'');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Peso de trabajo por sesión, último ${fmt(lp.w)} kilos">
    ${grid}${area}
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(lastI)}" cy="${y(lp.w)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${Math.min(x(lastI),W-pr-4)}" y="${y(lp.w)-10}" text-anchor="end" font-size="12" font-weight="600" fill="var(--ink)">${fmt(lp.w)} kg</text>
    ${xl}
    <line id="hx" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="var(--muted)" stroke-dasharray="3 3" opacity="0"/>
    <circle id="hc" r="5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2" opacity="0"/>
    <rect id="hit" x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
  </svg>`;
}
function bindChart(){
  const wrap=$('#chartwrap');if(!wrap||!chartPts.length)return;
  const svg=wrap.querySelector('svg'),tip=$('#tip'),hx=svg.querySelector('#hx'),hc=svg.querySelector('#hc');
  const move=ev=>{
    const r=svg.getBoundingClientRect(), sx=(ev.clientX-r.left)*chartGeom.W/r.width;
    let bi=0,bd=1e9;chartPts.forEach((p,i)=>{const d=Math.abs(chartGeom.x(i)-sx);if(d<bd){bd=d;bi=i}});
    const p=chartPts[bi],px=chartGeom.x(bi),py=chartGeom.y(p.w);
    hx.setAttribute('x1',px);hx.setAttribute('x2',px);hx.setAttribute('opacity','.6');
    hc.setAttribute('cx',px);hc.setAttribute('cy',py);hc.setAttribute('opacity','1');
    tip.innerHTML=`<b>${esc(dLabel(p.ts,{day:'numeric',month:'short'}))}</b> · ${fmt(p.w)} kg<br>Mejor: ${fmt(p.best.w)}×${p.best.r} · 1RM ≈ ${fmt(Math.round(p.e*2)/2)}`;
    tip.style.left=Math.min(Math.max(px*r.width/chartGeom.W,70),r.width-70)+'px';tip.style.top=(py*r.height/chartGeom.H)+'px';tip.style.opacity='1';
  };
  const leave=()=>{tip.style.opacity='0';hx.setAttribute('opacity','0');hc.setAttribute('opacity','0')};
  svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);svg.addEventListener('pointerleave',leave);
}

  press_maq:{m:'Pectoral, tríceps y deltoides anterior',c:['Ajustá el asiento para que las manijas queden a la altura del pecho medio.','Espalda apoyada y escápulas juntas; empujá hasta casi extender los codos.','Volvé lento hasta sentir estirar el pecho, sin despegar la espalda.']},
  press_inc_maq:{m:'Pectoral superior, deltoides anterior y tríceps',c:['Asiento a una altura en que las manijas arranquen a la altura de la parte alta del pecho.','Empujá hacia arriba y adelante sin despegar la espalda del respaldo.','Bajá controlado, con los codos algo por debajo de los hombros.']},
  remo_polea:{m:'Dorsal, romboides y bíceps',c:['Sentado con los pies apoyados y las rodillas algo flexionadas, torso erguido.','Tirá de la manija hacia el ombligo llevando los codos atrás y juntando las escápulas.','Volvé estirando los brazos sin inclinar el torso hacia adelante: la zona lumbar queda quieta.']},
  press_hombro_maq:{m:'Deltoides y tríceps',c:['Asiento con las manijas a la altura de los hombros y la espalda bien apoyada.','Empujá hacia arriba hasta casi extender los codos.','Bajá controlado sin arquear la zona lumbar.']},
  pajaros_maq:{m:'Deltoides posterior y trapecio medio',c:['En la máquina de aperturas, sentado mirando al respaldo, con el pecho apoyado.','Abrí los brazos hacia atrás con los codos apenas flexionados, hasta la línea de los hombros.','Volvé lento sin dejar que las placas se toquen.']},
  triceps_cabeza:{m:'Tríceps (sobre todo la porción larga)',c:['De espaldas a la polea, soga tomada detrás de la cabeza, un pie adelante y abdomen firme.','Extendé los codos hacia adelante y arriba, con los codos apuntando al frente.','Volvé hasta sentir estirar el tríceps, sin arquear la espalda.']},
  prensa_hor:{m:'Cuádriceps y glúteos',c:['Sentado con la espalda completamente apoyada y los pies al ancho de la cadera.','Doblá las rodillas hasta unos 90° sin que la cadera se despegue del asiento.','Empujá sin bloquear del todo las rodillas.']},
  bulgara:{m:'Cuádriceps y glúteos',c:['Empeine del pie de atrás apoyado en un banco, mancuernas a los costados y torso erguido.','Bajá en vertical hasta que el muslo de adelante quede casi paralelo al piso.','Subí empujando con todo el pie de adelante. Completá un lado y después el otro.']},
  curl_fem_sent:{m:'Isquiotibiales',c:['Sentado con la rodilla alineada con el eje de la máquina y el rodillo sobre los tobillos; trabá los muslos con la almohadilla.','Flexioná las rodillas llevando los talones hacia abajo y atrás.','Volvé lento hasta casi estirar las piernas.']},
  gemelos_sent:{m:'Sóleo y gemelos',c:['Sentado con la almohadilla sobre los muslos, cerca de las rodillas, y la punta de los pies en el borde.','Subí los talones lo más alto que puedas y apretá un segundo.','Bajá hasta sentir estirar la pantorrilla.']},
  jalon_neutro:{m:'Dorsal ancho y bíceps',c:['Sentado con los muslos trabados, manija de agarre neutro (palmas enfrentadas).','Bajá la manija al pecho alto llevando los codos hacia abajo y pegados al cuerpo.','Subí controlado hasta estirar los brazos.']},
  laterales_polea:{m:'Deltoides lateral',c:['De costado a la polea baja, tomá la manija con la mano más alejada.','Elevá el brazo hacia el costado hasta la altura del hombro, codo apenas flexionado.','Bajá lento, sin inclinar el torso.']},
  curl_polea:{m:'Bíceps',c:['De pie frente a la polea baja con barra o soga, codos pegados al torso.','Flexioná los codos sin mover los hombros.','Bajá controlado hasta casi estirar los brazos; la polea mantiene la tensión abajo.']},
  curl_martillo:{m:'Braquial, braquiorradial y bíceps',c:['De pie con las palmas enfrentadas (agarre de martillo) y los codos pegados.','Subí las mancuernas sin girar las muñecas.','Bajá controlado sin balancear el cuerpo.']},
  hip_thrust_maq:{m:'Glúteos e isquiotibiales',c:['Espalda alta apoyada en el respaldo y el cinturón o almohadilla sobre la cadera.','Subí la cadera apretando los glúteos hasta que el torso quede paralelo al piso.','Pausá un segundo arriba y bajá controlado, sin arquear la zona lumbar.']},
  pallof:{m:'Core: oblicuos y transverso, sin flexionar la columna',c:['Parate de costado a la polea, con el cable a la altura del pecho y la manija tomada con las dos manos.','Extendé los brazos hacia adelante resistiendo que el cable te gire el torso.','Sostené 2 segundos, volvé al pecho y después hacé el otro lado.']}
};
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
function pose(k,t){const F=FIG[k],P={};for(const j in F.A)P[j]=lerp(F.A[j],F.B[j]||F.A[j],t);return P}
function pl(cls,...pts){return `<polyline class="${cls}" points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/>`}
function figDraw(k,t){
  const F=FIG[k],P=pose(k,t);let back='',body='',front='';
  P.head=[P.sh[0]+(P.head[0]-P.sh[0])*1.4,P.sh[1]+(P.head[1]-P.sh[1])*1.4];
  const mir=p=>[200-p[0],p[1]];
  for(const pr of F.props||[]){
    const sides=F.front?[P.ha,mir(P.ha)]:[P.ha];
    if(pr.t==='cable'){back+=`<line x1="${pr.from[0]}" y1="${pr.from[1]}" x2="${P.ha[0]}" y2="${P.ha[1]}" class="cab"/><circle cx="${pr.from[0]}" cy="${pr.from[1]}" r="5" class="eqc"/>`}
    if(pr.t==='plate'){const a=P[pr.at],o=pr.off||[0,0];front+=`<circle cx="${a[0]+o[0]}" cy="${a[1]+o[1]}" r="13" class="plate"/><circle cx="${a[0]+o[0]}" cy="${a[1]+o[1]}" r="2.5" class="hub"/>`}
    if(pr.t==='db'){for(const h of sides)front+=`<line x1="${h[0]-7}" y1="${h[1]}" x2="${h[0]+7}" y2="${h[1]}" class="dbh"/><rect x="${h[0]-10}" y="${h[1]-5}" width="5" height="10" rx="1.5" class="dbw"/><rect x="${h[0]+5}" y="${h[1]-5}" width="5" height="10" rx="1.5" class="dbw"/>`}
    if(pr.t==='latbar'){front+=`<line x1="${P.ha[0]-24}" y1="${P.ha[1]}" x2="${P.ha[0]+24}" y2="${P.ha[1]}" class="dbh"/>`}
    if(pr.t==='lever'){back+=`<line x1="${pr.from[0]}" y1="${pr.from[1]}" x2="${P.ha[0]}" y2="${P.ha[1]}" class="eq" stroke-width="4"/><circle cx="${pr.from[0]}" cy="${pr.from[1]}" r="5" class="eqc"/>`;front+=`<line x1="${P.ha[0]}" y1="${P.ha[1]-7}" x2="${P.ha[0]}" y2="${P.ha[1]+7}" class="dbh"/>`}
    if(pr.t==='pad'){const a=P[pr.at];front+=`<circle cx="${a[0]}" cy="${a[1]}" r="6" class="dbw"/>`}
    if(pr.t==='toes'){const a=P.an;front+=`<line x1="${a[0]}" y1="${a[1]}" x2="${a[0]+8}" y2="${a[1]-9}" class="limb"/>`}
    if(pr.t==='sled'){const a=P.an,p=[.6,.8];front+=`<line x1="${a[0]-p[0]*18}" y1="${a[1]-p[1]*18}" x2="${a[0]+p[0]*18}" y2="${a[1]+p[1]*18}" class="sled"/>`}
  }
  const foot=a=>F.nofoot?'':`<line x1="${a[0]}" y1="${a[1]}" x2="${a[0]+(F.front?0:11)}" y2="${a[1]}" class="limb"/>`;
  if(F.front){
    const L={};for(const j in P)L[j]=mir(P[j]);
    body+=pl('limb',[100,47],[100,90])+pl('limb',L.sh,P.sh)+pl('limb',L.hip,P.hip);
    for(const S of [P,L])body+=pl('limb',S.hip,S.kn,S.an)+pl('limb',S.sh,S.el,S.ha);
  }else{
    if(P.kn2)back+=pl('limb far',P.hip,P.kn2,P.an2)+foot(P.an2);
    body+=pl('limb',P.an,P.kn,P.hip,P.sh)+foot(P.an)+pl('limb',P.sh,P.el,P.ha)+`<line x1="${P.sh[0]}" y1="${P.sh[1]}" x2="${P.head[0]}" y2="${P.head[1]}" class="limb"/>`;
  }
  body+=`<circle cx="${P.head[0]}" cy="${P.head[1]}" r="9" class="headc"/>`;
  return `<line x1="6" x2="194" y1="151.5" y2="151.5" class="fl"/>${F.st||''}${back}${body}${front}`;
}
let howK=null,howPlay=true,howT0=0,howRaf=null,howTman=0;
const CYCLE=3200;
function ease(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2}
function cyc(u){if(u<.12)return 0;if(u<.5)return ease((u-.12)/.38);if(u<.62)return 1;return 1-ease((u-.62)/.38)}
function howFrame(now){
  if(!howK)return;
  let t=howTman;
  if(howPlay){const u=((now-howT0)%CYCLE)/CYCLE;t=cyc(u);howTman=t;const sc=$('#scrub');if(sc)sc.value=Math.round(t*100)}
  $('#fig').innerHTML=figDraw(howK,t);
  const ph=$('#phase');if(ph)ph.textContent=t<.1?'Posición inicial':t>.9?'Posición final':'Movimiento';
  if(howPlay&&!reduceMotion)howRaf=requestAnimationFrame(howFrame);
}
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function openHow(k){
  editId=null;const hasFig=!!FIG[k];
  howK=hasFig?k:null;howPlay=!reduceMotion;howTman=0;const e=EX[k],h=HOW[k]||{m:'—',c:[]};
  const q=encodeURIComponent(e.n+' técnica');
  $('#sheet').innerHTML=`<div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="shT">
    <div class="row between"><h3 id="shT">${e.n}</h3><button class="btn sec small" data-act="howclose" aria-label="Cerrar">✕</button></div>
    ${hasFig?`<div class="figbox"><svg viewBox="0 -22 200 178" role="img" aria-label="Animación de ${e.n}"><g id="fig"></g></svg></div>
    <div class="row" style="flex-wrap:nowrap">
      <button class="btn sec small" data-act="howplay" id="playbtn" style="min-width:88px">${howPlay?'Pausa':'Reproducir'}</button>
      <input type="range" id="scrub" min="0" max="100" value="0" aria-label="Recorrer el movimiento" style="flex:1;accent-color:var(--accent)">
    </div>
    <p class="small muted" id="phase" style="text-align:center">Posición inicial</p>`:''}
    <p class="small"><b>Trabaja:</b> ${h.m}</p>
    <ol class="mob">${h.c.map(c=>`<li>${c}</li>`).join('')}</ol>
    <a class="btn sec" style="text-align:center;text-decoration:none" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">Ver videos de la técnica ↗</a>
  </div>`;
  $('#sheet').hidden=false;
  if(!hasFig)return;
  howT0=performance.now();cancelAnimationFrame(howRaf);howRaf=requestAnimationFrame(howFrame);
  $('#scrub').addEventListener('input',ev=>{howPlay=false;$('#playbtn').textContent='Reproducir';howTman=ev.target.value/100;cancelAnimationFrame(howRaf);howFrame(performance.now())});
}
function closeHow(){howK=null;cancelAnimationFrame(howRaf);$('#sheet').hidden=true;$('#sheet').innerHTML=''}
function toggleHow(){
  howPlay=!howPlay;$('#playbtn').textContent=howPlay?'Pausa':'Reproducir';
  if(howPlay){const u0=howTman*0.38+0.12;howT0=performance.now()-u0*CYCLE;cancelAnimationFrame(howRaf);howRaf=requestAnimationFrame(howFrame)}
}
$('#sheet').addEventListener('click',ev=>{if(ev.target.id==='sheet')closeSheet()});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('#sheet').hidden)closeSheet()});

/* ===================== Eventos ===================== */
app.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.f&&draft){const it=draft.items[+t.dataset.i],s=it.sets[+t.dataset.s];
    if(t.dataset.f==='w')s.w=num(t.value);else{const n=num(t.value);s.r=n==null?null:Math.round(n)}
    draftSave()}
  if(t.dataset.note){const k=t.dataset.note,v=t.value;if(v.trim())S.notes[k]=v;else delete S.notes[k];lsSave()}
});
app.addEventListener('change',ev=>{if(ev.target.dataset&&ev.target.dataset.note){persist();return}
  if(ev.target.id==='exsel'){progEx=ev.target.value;render()}
  if(ev.target.id==='impfile'&&ev.target.files[0]){ev.target.files[0].text().then(t=>{$('#imp').value=t;document.querySelector('[data-act=import]').click()})}});
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a!=='reset')confirmReset=false;
  if(a!=='cancel')confirmCancel=false;
  const rerender=()=>{const y=window.scrollY;render();window.scrollTo(0,y)};
  switch(a){
    case 'tab':view=b.dataset.v;if(view==='hoy')summary=null;render();window.scrollTo(0,0);break;
    case 'plan':todayPlan=b.dataset.p;render();break;
    case 'rd':todayRd=b.dataset.r;render();break;
    case 'start':startSession();break;
    case 'mob':logMobility();break;
    case 'deload':S.deload=DELOAD_LEN;persist();render();break;
    case 'enddeload':S.deload=0;S.sinceDeload=0;persist();render();break;
    case 'done':{
      audio();
      const i=+b.dataset.i,j=+b.dataset.s,it=draft.items[i],s=it.sets[j];
      s.done=!s.done;finishWarn=null;
      if(s.done){
        if(it.sets[j+1]&&it.sets[j+1].w==null)it.sets[j+1].w=s.w;
        const last=draft.items.every(x=>x.sets.every(y=>y.done));
        if(!last)startTimer(it.rest,EX[it.k].n);else stopTimer();
      }
      draftSave();const y=window.scrollY;render();window.scrollTo(0,y);break}
    case 'addset':{const it=draft.items[+b.dataset.i],l=it.sets[it.sets.length-1];it.sets.push({w:l?l.w:null,r:it.target,done:false});draftSave();const y=window.scrollY;render();window.scrollTo(0,y);break}
    case 'delset':{const it=draft.items[+b.dataset.i];it.sets.pop();draftSave();const y=window.scrollY;render();window.scrollTo(0,y);break}
    case 'how':openHow(b.dataset.k);break;
    case 'howclose':closeHow();break;
    case 'howplay':toggleHow();break;
    case 'finish':finishSession(false);break;
    case 'finishforce':finishSession(true);break;
    case 'cancel':
      if(!confirmCancel){confirmCancel=true;rerender();break}
      confirmCancel=false;finishWarn=null;draft=null;draftSave();stopTimer();render();window.scrollTo(0,0);break;
    case 'keep':rerender();break;
    case 'swopen':openSwap(+b.dataset.i);break;
    case 'swclose':closeSheet();break;
    case 'swap':doSwap(+b.dataset.i,b.dataset.k,b.dataset.perm==='1');break;
    case 'unswap':delete S.swaps[b.dataset.k];persist();render();break;
    case 'note':{const k=b.dataset.k;notesOpen[k]=!notesOpen[k];if(!notesOpen[k])persist();rerender();if(notesOpen[k]){const ta=document.querySelector(`[data-note="${k}"]`);if(ta)ta.focus()}break}
    case 'notif':askNotif();break;
    case 'testnotif':swPost({type:'timer',end:Date.now()+5000,label:'Prueba',force:true});msg2(b,'Listo: bloqueá el celular y esperá 5 segundos.');break;
    case 'edopen':openEdit(b.dataset.id);break;
    case 'edclose':closeSheet();break;
    case 'edsave':saveEdit(editId);closeSheet();rerender();break;
    case 'eddel':
      if(confirmDel!==editId){confirmDel=editId;b.textContent='Tocá de nuevo para borrar la sesión';break}
      deleteSession(editId);closeSheet();rerender();break;
    case 'bsnooze':S.backupSnooze=Date.now()+3*864e5;lsSave();rerender();break;
    case 'badd':if(addBody())rerender();break;
    case 'bdel':body=body.filter(x=>String(x.ts)!==b.dataset.ts);persistBody();rerender();break;
    case 't-plus':if(tmr){tmr.end+=15000;tmr.total+=15;drawTimer();syncTimerSW()}break;
    case 't-minus':if(tmr){tmr.end-=15000;drawTimer();syncTimerSW()}break;
    case 't-skip':stopTimer();break;
    case 'savewt':
      document.querySelectorAll('[data-wt]').forEach(inp=>{const k=inp.dataset.wt,v=num(inp.value);
        const cur=S.ex[k]&&S.ex[k].w!=null?S.ex[k].w:null;
        if(v!==cur){S.ex[k]=Object.assign({fails:0,last:null},S.ex[k],{w:v,fails:0,last:null})}});
      persist();render();break;
    case 'reentry':S.phaseStart=S.done;S.deload=0;persist();render();break;
    case 'export':
      try{await navigator.clipboard.writeText(backupData());markBackup();msg('Respaldo copiado. Pegalo en una nota o mandátelo por mail.')}
      catch(e){$('#imp').value=backupData();markBackup();msg('No pude copiar automáticamente: el respaldo quedó en el cuadro de arriba, copialo a mano.')}
      break;
    case 'download':{
      const blob=new Blob([backupData()],{type:'application/json'});markBackup();if(view==='hoy')setTimeout(render,50);const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);a.download='entrenador-respaldo-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);msg('Respaldo descargado.');break}
    case 'import':{
      let d;try{d=JSON.parse($('#imp').value)}catch(e){msg('El texto pegado no es un respaldo válido.');break}
      if(!d||!d.S||!Array.isArray(d.sessions)){msg('Falta información en el respaldo.');break}
      S=normalize(d.S);sessions=d.sessions.filter(s=>s&&s.id&&s.ts).sort((x,y)=>y.ts-x.ts);body=Array.isArray(d.body)?d.body:[];S.lastBackup=Date.now();lsSave();
      if(cloud.db){const list=sessions.slice(),sn=clone(S);queue(async()=>{for(const s of list)await sessCol().doc(String(s.id)).set(stripId(s));await profRef().set({S:sn})})}
      render();msg('Respaldo restaurado.');break}
    case 'reset':
      if(!confirmReset){confirmReset=true;render();break}
      confirmReset=false;
      {const old=sessions.slice();S=freshState();sessions=[];body=[];draft=null;draftSave();lsSave();
       if(cloud.db){const sn=clone(S);queue(async()=>{for(const s of old)await sessCol().doc(String(s.id)).delete();await profRef().set({S:sn})})}}
      view='hoy';render();break;
  }
});

lsLoad();
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
/* Mantener la pantalla encendida durante la sesión */
let wake=null;
async function syncWake(){try{if(draft&&!wake&&'wakeLock' in navigator&&document.visibilityState==='visible'){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}else if(!draft&&wake){await wake.release();wake=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){syncWake();drawTimer()}});
setInterval(syncWake,5000);syncWake();
</script>
